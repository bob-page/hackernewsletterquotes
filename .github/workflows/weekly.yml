name: Weekly update

# Issues go out on Friday around 11:00-13:00 UTC, and the page appears on Buttondown
# the same day. Saturday and Monday catch a late issue.
on:
  schedule:
    - cron: "0 18 * * 5"
    - cron: "0 18 * * 6"
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_latest.py
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing new"
            exit 0
          fi
          issue=$(git diff -U0 quotes.csv | grep -E '^\+[0-9]' | tail -1 | cut -c2- | cut -d, -f1)
          branch="issue-$issue"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add quotes.csv README.md
          git commit -m "Add issue #$issue"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --title "Add issue #$issue" --body "Added by the weekly update. Check the new row, then merge." --head "$branch"
          fi
